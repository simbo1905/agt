[package]
name = "agt-snapshot"
version.workspace = true
edition = "2021"
authors = ["AI Coding Agent"]
license = "MIT"
description = "Standalone filesystem snapshot tool: save, diff, and restore snapshots"

[[bin]]
name = "agt-snapshot"
path = "src/main.rs"

[dependencies]
agt-core = { path = "../agt-core" }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
gix = { workspace = true }
gix-object = { workspace = true }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
